# Application Configuration
spring.application.name=bookstore-api

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookstoredb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security & JWT Configuration (Secret supplied via JWT_SECRET environment variable; no usable secret committed)
# For local development: export JWT_SECRET="your-256-bit-base64-or-plain-secret-key-min-32-bytes"
bookstore.security.jwt.secret=${JWT_SECRET:}
bookstore.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Bookstore Demo Business Assumptions
bookstore.gift-points.rate=${GIFT_POINTS_RATE:100}
bookstore.shipping.flat-rate=${SHIPPING_FLAT_RATE:5.00}
bookstore.shipping.free-threshold=${SHIPPING_FREE_THRESHOLD:50.00}
bookstore.cancellation.window-hours=${CANCELLATION_WINDOW_HOURS:48}

# Springdoc OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
